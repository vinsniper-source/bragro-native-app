name: Android build

# Nenhuma ferramenta Android roda no ambiente onde este projeto foi escrito
# (sem SDK/emulador) -- toda a verificacao ate agora foi manual (contagem de
# chaves/parenteses, releitura de imports). Este workflow fecha essa lacuna:
# a cada push/PR pro main, compila de verdade (assembleDebug) num runner com
# JDK e Android SDK reais, pegando erro de tipo/import/assinatura que a
# revisao manual pode deixar passar.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Permissao de execucao do gradlew
        run: chmod +x gradlew

      - name: Compilar (debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Testes de unidade
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Publicar relatorio de lint (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Publicar relatorio de testes (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
