# Xmx subido de 2048m -> 4096m: o build de RELEASE (R8/minificacao, mais
# pesado que o debug) derrubou o daemon do Gradle com um crash nativo de JVM
# (hs_err_pid...log) na primeira tentativa de assembleRelease deste projeto
# -- 2GB nao e incomum sobrar curto pra R8 processar Compose+Kotlin
# Serialization+Retrofit juntos. Se voltar a faltar memoria, suba de novo
# (6144m/8192m) conforme a RAM disponivel na maquina.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
