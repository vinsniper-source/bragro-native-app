# Xmx subido de 2048m -> 4096m -> 6144m: o build de RELEASE (R8/minificacao,
# mais pesado que o debug) derrubou o daemon do Gradle com um crash nativo de
# JVM (hs_err_pid...log, "insufficient memory"/mmap failed) repetidas vezes
# neste projeto -- R8 processando Compose+Kotlin Serialization+Retrofit juntos
# pesa bastante. workers.max limitado a 2 pra reduzir picos de memoria nativa
# concorrente. Se voltar a faltar memoria, suba o Xmx de novo (8192m) e/ou
# rode ".\gradlew --stop" antes de cada build pra matar daemons antigos presos
# (cada daemon parado ainda reserva a memoria do seu -Xmx).
org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
