# ATENCAO: a maquina de build deste projeto tem so 4GB de RAM total (~3,84GB
# utilizaveis, Celeron J4005, sem GPU dedicada) -- nao e um problema de "Xmx
# baixo", e um problema de RAM FISICA insuficiente pro pipeline de release
# (Gradle daemon + Kotlin daemon + processo externo do R8, todos rodando ao
# mesmo tempo). Subir o Xmx tentando "dar mais memoria" so piora: pedir mais
# heap do que existe de RAM livre garante o crash nativo de mmap de novo.
# A solucao aqui e o oposto -- heap pequeno e deliberadamente sequencial:
#   - Xmx baixo (deixa RAM de sobra pro Kotlin daemon + R8 + Windows)
#   - kotlin.daemon.jvm.options com teto proprio (senao o Kotlin daemon usa
#     heuristica baseada na RAM da maquina e pode pedir memoria demais sozinho)
#   - workers.max=1 e parallel=false (nada rodando em paralelo = pico de
#     memoria menor, mesmo que o build fique mais lento)
# Antes de CADA build: fechar navegador/outros programas e rodar
# ".\gradlew --stop" pra matar daemons antigos presos (cada um ainda reserva
# a memoria do seu proprio -Xmx enquanto fica parado).
# Se AINDA crashar com essas configs, o proximo passo nao e mexer aqui de
# novo -- e considerar isMinifyEnabled = false temporariamente em
# app/build.gradle.kts (comentario ja la documenta isso como fallback valido).
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
kotlin.daemon.jvm.options=-Xmx768m
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
